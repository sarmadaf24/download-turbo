name: دانلود تلاوت‌های قرآن (نسخه پایدار)

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  download-qaris:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # جلوگیری از توقف کل فرآیند در صورت خطای یکی
      matrix:
        qari: [
          # ---------- عبدالباسط ----------
          {name: "Abdul_Basit_Murattal_192kbps",   display: "Abdul_Basit_Murattal_192kbps"},
          {name: "Abdul_Basit_Mujawwad_128kbps",  display: "Abdul_Basit_Mujawwad_128kbps"},
          
          # ---------- دیگر قاریان اصلی (با نام پوشه دقیق از سایت) ----------
          {name: "Abdullah_Basfar_192kbps",        display: "Abdullah_Basfar_192kbps"},
          {name: "AbdulSamad_64kbps_QuranExplorer.Com", display: "AbdulSamad_QuranExplorer_64kbps"},
          {name: "Abdullaah_3awwaad_Al-Juhaynee_128kbps", display: "Al-Juhaynee_128kbps"},
          {name: "Abdullah_Matroud_128kbps",       display: "Abdullah_Matroud_128kbps"},
          {name: "Abdurrahmaan_As-Sudais_192kbps", display: "Sudais_192kbps"},
          {name: "Abu_Bakr_Ash-Shaatree_128kbps", display: "Ash-Shaatree_128kbps"},
          {name: "Ahmed_Neana_128kbps",            display: "Ahmed_Neana_128kbps"},
          {name: "Ali_Jaber_64kbps",               display: "Ali_Jaber_64kbps"},
          {name: "Aziz_Alili_128kbps",             display: "Aziz_Alili_128kbps"},
          {name: "Hani_Rifai_192kbps",             display: "Hani_Rifai_192kbps"},
          {name: "Hudhaify_128kbps",               display: "Hudhaify_128kbps"},
          {name: "Husary_128kbps",                 display: "Husary_Murattal_128kbps"},
          {name: "Husary_128kbps_Mujawwad",        display: "Husary_Mujawwad_128kbps"},
          {name: "Husary_Muallim_128kbps",         display: "Husary_Muallim_128kbps"},
          {name: "Ibrahim_Akhdar_64kbps",          display: "Ibrahim_Akhdar_64kbps"},
          {name: "Mahmoud_Ali_Al-Banna_32kbps",    display: "Al-Banna_32kbps"},  # نام دقیق از دایرکتوری
          {name: "Minshawy_Mujawwad_192kbps",      display: "Minshawy_Mujawwad_192kbps"},
          {name: "Minshawy_Murattal_128kbps",      display: "Minshawy_Murattal_128kbps"},
          {name: "Mohammad_al_Tablaway_128kbps",   display: "Tablaway_128kbps"},
          {name: "Muhammad_AbdulKareem_128kbps",   display: "AbdulKareem_128kbps"},
          {name: "Muhammad_Ayyoub_128kbps",        display: "Muhammad_Ayyoub_128kbps"},
          {name: "Muhammad_Jibreel_128kbps",       display: "Jibreel_128kbps"},
          {name: "Muhsin_Al_Qasim_192kbps",        display: "Muhsin_Al_Qasim_192kbps"},
          {name: "Mustafa_Ismail_48kbps",          display: "Mustafa_Ismail_48kbps"},
          {name: "Sahl_Yassin_128kbps",            display: "Sahl_Yassin_128kbps"},
          {name: "Salah_Al_Budair_128kbps",        display: "Salah_Al_Budair_128kbps"},
          {name: "Salaah_AbdulRahman_Bukhatir_128kbps", display: "Bukhatir_128kbps"},
          
          # ---------- قرائت ورش ----------
          {name: "Abdul_Basit_Murattal_192kbps",   display: "Abdul_Basit_Warsh_192kbps", isWarsh: true},
          # برای ورش باید پوشه را جداگانه بررسی کنید. در دایرکتوری 'warsh' هستند.
        ]
    steps:
      - name: آماده‌سازی محیط
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl

      - name: ایجاد دایرکتوری موقت
        run: |
          mkdir -p "${{ matrix.qari.display }}"
          cd "${{ matrix.qari.display }}"

      - name: دانلود فایل‌های MP3
        run: |
          TARGET_DIR="${{ matrix.qari.display }}"
          # ساخت آدرس پایه: اگر isWarsh=true باشد، آدرس تغییر می‌کند.
          if [ "${{ matrix.qari.isWarsh }}" = "true" ]; then
            BASE_URL="https://everyayah.com/data/warsh/${{ matrix.qari.name }}/"
          else
            BASE_URL="https://everyayah.com/data/${{ matrix.qari.name }}/"
          fi
          
          echo "در حال دانلود از $BASE_URL"
          
          # حلقه دانلود سوره‌ها
          for sura in {001..114}; do
            URL="${BASE_URL}${sura}.mp3"
            OUTPUT="${TARGET_DIR}/${sura}.mp3"
            
            # استفاده از -L برای دنبال کردن ریدایرکت، -f برای خطا در صورت فیلد بودن
            HTTP_CODE=$(curl -L --fail --silent --output "$OUTPUT" --write-out "%{http_code}" "$URL")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ دانلود سوره $sura انجام شد"
            else
              echo "⚠️ سوره $sura یافت نشد (کد $HTTP_CODE) - نادیده گرفته شد"
              rm -f "$OUTPUT"  # حذف فایل خالی
            fi
          done

      - name: زیپ کردن فایل‌های دانلود شده
        run: |
          cd "${{ matrix.qari.display }}"
          zip -r "../${{ matrix.qari.display }}.zip" .
          cd ..
          echo "📦 فایل ZIP ساخته شد: $(du -h ${{ matrix.qari.display }}.zip | cut -f1)"

      - name: آپلود به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.qari.display }}"
          path: "${{ matrix.qari.display }}.zip"
          retention-days: 90
