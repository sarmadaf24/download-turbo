name: دانلود هوشمند تلاوت‌های قرآن (سازگار با ساختار everyayah)

on:
  workflow_dispatch:

jobs:
  download-quran:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        qari: [
          {name: "Abdul Basit - Murattal - 192kbps",   folder: "Abdul_Basit_Murattal_192kbps", pattern: "sura"},
          {name: "Abdul Basit - Mujawwad - 128kbps",   folder: "Abdul_Basit_Mujawwad_128kbps", pattern: "standard"},
          {name: "Abdullah Basfar - 192kbps",          folder: "Abdullah_Basfar_192kbps", pattern: "standard"},
          {name: "AbdulSamad - 64kbps",                folder: "AbdulSamad_64kbps_QuranExplorer.Com", pattern: "standard"},
          {name: "Abdullaah Al-Juhaynee - 128kbps",    folder: "Abdullaah_3awwaad_Al-Juhaynee_128kbps", pattern: "standard"},
          {name: "Abdullah Matroud - 128kbps",         folder: "Abdullah_Matroud_128kbps", pattern: "standard"},
          {name: "Abdurrahmaan As-Sudais - 192kbps",   folder: "Abdurrahmaan_As-Sudais_192kbps", pattern: "standard"},
          {name: "Abu Bakr Ash-Shaatree - 128kbps",    folder: "Abu_Bakr_Ash-Shaatree_128kbps", pattern: "standard"},
          {name: "Ahmed Neana - 128kbps",              folder: "Ahmed_Neana_128kbps", pattern: "standard"},
          {name: "Ali Jaber - 64kbps",                 folder: "Ali_Jaber_64kbps", pattern: "standard"},
          {name: "Aziz Alili - 128kbps",               folder: "aziz_alili_128kbps", pattern: "standard"},
          {name: "Hani Rifai - 192kbps",               folder: "Hani_Rifai_192kbps", pattern: "standard"},
          {name: "Hudhaify - 128kbps",                 folder: "Hudhaify_128kbps", pattern: "standard"},
          {name: "Husary - Murattal - 128kbps",        folder: "Husary_128kbps", pattern: "standard"},
          {name: "Husary - Mujawwad - 128kbps",        folder: "Husary_128kbps_Mujawwad", pattern: "standard"},
          {name: "Husary - Muallim - 128kbps",         folder: "Husary_Muallim_128kbps", pattern: "standard"},
          {name: "Ibrahim Akhdar - 64kbps",            folder: "Ibrahim_Akhdar_64kbps", pattern: "standard"},
          {name: "Mahmoud Ali Al-Banna - 32kbps",      folder: "mahmoud_ali_al_banna_32kbps", pattern: "standard"},
          {name: "Minshawy - Mujawwad - 192kbps",      folder: "Minshawy_Mujawwad_192kbps", pattern: "standard"},
          {name: "Minshawy - Murattal - 128kbps",      folder: "Minshawy_Murattal_128kbps", pattern: "standard"},
          {name: "Mohammad al Tablaway - 128kbps",     folder: "Mohammad_al_Tablaway_128kbps", pattern: "standard"},
          {name: "Muhammad AbdulKareem - 128kbps",     folder: "Muhammad_AbdulKareem_128kbps", pattern: "standard"},
          {name: "Muhammad Ayyoub - 128kbps",          folder: "Muhammad_Ayyoub_128kbps", pattern: "standard"},
          {name: "Muhammad Jibreel - 128kbps",         folder: "Muhammad_Jibreel_128kbps", pattern: "standard"},
          {name: "Muhsin Al Qasim - 192kbps",          folder: "Muhsin_Al_Qasim_192kbps", pattern: "standard"},
          {name: "Mustafa Ismail - 48kbps",            folder: "Mustafa_Ismail_48kbps", pattern: "standard"},
          {name: "Sahl Yassin - 128kbps",              folder: "Sahl_Yassin_128kbps", pattern: "standard"},
          {name: "Salah Al Budair - 128kbps",          folder: "Salah_Al_Budair_128kbps", pattern: "standard"},
          {name: "Salaah Bukhatir - 128kbps",          folder: "Salaah_AbdulRahman_Bukhatir_128kbps", pattern: "standard"},
          {name: "Abdul Basit - Warsh - 128kbps",      folder: "warsh/Abdul_Basit_Murattal_128kbps", pattern: "standard"},
          {name: "Ibrahim Al-Dosary - Warsh - 128kbps",folder: "warsh/Ibrahim_Al-Dosary_128kbps", pattern: "standard"},
          {name: "Yassin Al-Jazaery - Warsh - 64kbps", folder: "Yassin_Al-Jazaery_Warsh_64kbps", pattern: "standard"}
        ]
    steps:
      - name: نصب ابزارها
        run: sudo apt-get update && sudo apt-get install -y zip curl

      - name: دریافت لیست فایل‌های پوشه
        run: |
          echo "⏳ دریافت لیست فایل‌ها از https://everyayah.com/data/${{ matrix.qari.folder }}/"
          curl -L "https://everyayah.com/data/${{ matrix.qari.folder }}/" -o index.html
          
          if [ "${{ matrix.qari.pattern }}" = "sura" ]; then
            grep -oP '[0-9]{6}\.mp3' index.html | sort -u > filelist.txt
          else
            grep -oP '[0-9]{3}\.mp3' index.html | sort -u > filelist.txt
          fi
          
          echo "✅ تعداد فایل‌های یافت شده: $(wc -l < filelist.txt)"

      - name: دانلود فایل‌ها
        run: |
          TARGET_DIR="${{ matrix.qari.name }}"
          mkdir -p "$TARGET_DIR"
          cd "$TARGET_DIR"
          
          while IFS= read -r filename; do
            FILE_URL="https://everyayah.com/data/${{ matrix.qari.folder }}/$filename"
            echo "⏳ دانلود: $filename"
            curl -L --fail --silent --output "$filename" "$FILE_URL" && echo "✅ $filename" || echo "⚠️ خطا: $filename"
          done < ../filelist.txt
          
          cd ..

      - name: زیپ کردن فایل‌ها
        run: |
          zip -r "${{ matrix.qari.name }}.zip" "${{ matrix.qari.name }}/"
          echo "📦 حجم ZIP: $(du -h ${{ matrix.qari.name }}.zip | cut -f1)"

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.qari.name }}"
          path: "${{ matrix.qari.name }}.zip"
          retention-days: 90
