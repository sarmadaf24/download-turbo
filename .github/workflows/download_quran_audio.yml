name: Get Quran Phonetic Files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir quran_data
          cd quran_data
          
          # فقط فایل buckwalter (حاوی تلفظ)
          curl -L -o buckwalter.txt "https://raw.githubusercontent.com/quranicdata/quranic-corpus/master/data/buckwalter.txt"
          
          # فایل quran-simple (متن ساده)
          curl -L -o quran-simple.txt "https://raw.githubusercontent.com/quranicdata/quranic-corpus/master/data/quran-simple.txt"
          
          # فایل mappings (برای تبدیل به MFA)
          curl -L -o mapping.txt "https://raw.githubusercontent.com/quranicdata/quranic-corpus/master/data/mapping-buckwalter.txt"
          
          ls -la
          
      - uses: actions/upload-artifact@v4
        with:
          name: quran-phonetic-files
          path: quran_data/
