name: دانلود تلاوت‌های قرآن از everyayah.com

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  download-qaris:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # ⬅️ کلیدی: اگر یک جاب خطا داد، بقیه متوقف نشن
      max-parallel: 5    # تعداد جاب‌های همزمان، برای جلوگیری از قطعی
      matrix:
        include:
          # قاریانی که اسم پوشه آن‌ها را می‌دانیم و تست شده‌اند
          - folder: "Abdul_Basit_Murattal_64kbps"      # کیفیت 64 کیلوبیت بر ثانیه
            name: "Abdul_Basit_Murattal (64kbps)"
          - folder: "Abdul_Basit_Murattal_192kbps"     # کیفیت 192 کیلوبیت بر ثانیه
            name: "Abdul_Basit_Murattal (192kbps)"
          - folder: "Abdul_Basit_Mujawwad_128kbps"
            name: "Abdul_Basit_Mujawwad"
          - folder: "Abdullah_Basfar_192kbps"
            name: "Abdullah_Basfar"
          - folder: "AbdulSamad_64kbps_QuranExplorer.Com"
            name: "AbdulSamad (QuranExplorer.Com)"
          - folder: "Abdullaah_3awwaad_Al-Juhaynee_128kbps"
            name: "Abdullaah 3awwaad Al-Juhaynee"
          - folder: "Abdullah_Matroud_128kbps"
            name: "Abdullah Matroud"
          - folder: "Abdurrahmaan_As-Sudais_192kbps"
            name: "Abdurrahmaan As-Sudais"
          - folder: "Abu_Bakr_Ash-Shaatree_128kbps"
            name: "Abu Bakr Ash-Shaatree"
          - folder: "Ahmed_Neana_128kbps"
            name: "Ahmed Neana"
          - folder: "Ali_Jaber_64kbps"
            name: "Ali Jaber"
          - folder: "Aziz_Alili_128kbps"
            name: "Aziz Alili"
          - folder: "Hani_Rifai_64kbps"
            name: "Hani Rifai (64kbps)"
          - folder: "Hani_Rifai_192kbps"
            name: "Hani Rifai (192kbps)"
          - folder: "Hudhaify_128kbps"
            name: "Hudhaify"
          - folder: "Husary_128kbps"
            name: "Husary (Murattal)"
          - folder: "Husary_128kbps_Mujawwad"          # مسیر مجود حسری
            name: "Husary (Mujawwad)"
          - folder: "Husary_Muallim_128kbps"           # مسیر معلم حسری
            name: "Husary (Muallim)"
          - folder: "Ibrahim_Akhdar_64kbps"
            name: "Ibrahim Akhdar"
          - folder: "Mahmoud_Ali_Al-Banna_32kbps"
            name: "Mahmoud Ali Al-Banna"
          - folder: "Minshawy_Mujawwad_192kbps"
            name: "Minshawy (Mujawwad)"
          - folder: "Minshawy_Murattal_128kbps"
            name: "Minshawy (Murattal)"
          - folder: "Mohammad_al_Tablaway_128kbps"
            name: "Mohammad al Tablaway"
          - folder: "Muhammad_AbdulKareem_128kbps"
            name: "Muhammad AbdulKareem"
          - folder: "Muhammad_Ayyoub_128kbps"
            name: "Muhammad Ayyoub"
          - folder: "Muhammad_Jibreel_128kbps"
            name: "Muhammad Jibreel"
          - folder: "Muhsin_Al_Qasim_192kbps"
            name: "Muhsin Al Qasim"
          - folder: "Mustafa_Ismail_48kbps"
            name: "Mustafa Ismail"
          - folder: "Sahl_Yassin_128kbps"
            name: "Sahl Yassin"
          - folder: "Salah_Al_Budair_128kbps"
            name: "Salah Al Budair"
          - folder: "Salaah_AbdulRahman_Bukhatir_128kbps"
            name: "Salaah AbdulRahman Bukhatir"
          # سبد ورش
          - folder: "Abdul_Basit_Murattal_192kbps"      # برای ورش، اگر آدرس متفاوت است، بعداً اصلاح شود
            name: "Abdul Basit (Warsh) - نیاز به بررسی آدرس"
          - folder: "Ibrahim_Al-Dosary_128kbps"        # حدس برای ورش ابراهیم الدوسری
            name: "Ibrahim Al-Dosary (Warsh)"
          - folder: "Yassin_Al-Jazaery_Warsh_64kbps"
            name: "Yassin Al-Jazaery (Warsh)"

    steps:
      - name: آماده‌سازی محیط
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl

      - name: دانلود فایل‌های MP3 برای ${{ matrix.name }}
        continue-on-error: true  # ⬅️ کلیدی: اگر این مرحله خطا داد، ادامه بده به مراحل بعدی همین جاب
        run: |
          mkdir -p "${{ matrix.name }}"
          cd "${{ matrix.name }}"
          BASE_URL="https://everyayah.com/data/${{ matrix.folder }}/"
          echo "در حال دانلود از $BASE_URL برای ${{ matrix.name }}"
          for sura in {001..114}; do
            URL="${BASE_URL}${sura}.mp3"
            OUTPUT="${sura}.mp3"
            # --fail باعث می‌شود در صورت 404 خطا بدهد و ما آن را بگیریم
            HTTP_CODE=$(curl -L --fail --silent --output "$OUTPUT" --write-out "%{http_code}" "$URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ دانلود سوره $sura"
            else
              echo "⚠️ سوره $sura موجود نیست (کد $HTTP_CODE)"
              rm -f "$OUTPUT"
            fi
          done

      - name: زیپ کردن فایل‌های دانلود شده برای ${{ matrix.name }}
        continue-on-error: true
        run: |
          cd "${{ matrix.name }}"
          zip -r "../${{ matrix.name }}.zip" .
          cd ..
          echo "📦 فایل ZIP ساخته شد: $(du -h ${{ matrix.name }}.zip | cut -f1)"

      - name: آپلود فایل زیپ به عنوان Artifact برای ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}"
          path: "${{ matrix.name }}.zip"
          retention-days: 90
