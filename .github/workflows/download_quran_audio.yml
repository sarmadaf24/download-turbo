name: Abdul_Basit_Mujawwad_128kbps_Part2_Surahs_011-030
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y zip curl
      - run: |
          mkdir -p "Abdul_Basit_Mujawwad_Part2" && cd "Abdul_Basit_Mujawwad_Part2"
          for s in {011..030}; do
            curl -L -o "Surah_${s}.zip" "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/zips/${s}.zip"
            echo "✅ سوره $s"
          done
          cd ..
      - run: zip -r "Abdul_Basit_Mujawwad_128kbps_Part2.zip" "Abdul_Basit_Mujawwad_Part2"
      - uses: actions/upload-artifact@v4
        with:
          name: "Abdul_Basit_Mujawwad_128kbps_Part2"
          path: "Abdul_Basit_Mujawwad_128kbps_Part2.zip"
