name: پیدا کردن ZIP عبدالباسط
on: workflow_dispatch
jobs:
  find-zip:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🔍 بررسی پوشه zips:"
          curl -L "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/zips/" 2>/dev/null | grep -E 'href=".*\.zip"'
          
          echo ""
          echo "🔍 بررسی کل پوشه اصلی:"
          curl -L "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/" 2>/dev/null | grep -E 'href=".*\.zip"'
