name: 04-Full-Quran-API-fawazahmed0
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install git and zip
        run: sudo apt-get update && sudo apt-get install -y git zip

      - name: Clone full repository (includes ALL word-by-word translations)
        run: |
          git clone https://github.com/fawazahmed0/quran-api.git Quran_API_Complete
          cd Quran_API_Complete
          echo "📁 کل ریپازیتوری clone شد. حجم تقریبی:"
          du -sh .
          echo ""
          echo "📂 لیست پوشه‌ها:"
          ls -la

      - name: Show word-by-word files location
        run: |
          cd Quran_API_Complete
          echo "🔍 جستجوی فایل‌های word-by-word..."
          echo ""
          echo "✅ فایل‌های word-by-word در پوشه 'editions' قرار دارند:"
          ls editions/ | grep -E "(word|en_|fa_|ur_|id_|tr_|ru_|es_|fr_|bn_|zh_)" | head -20
          echo ""
          echo "📊 تعداد کل فایل‌های word-by-word:"
          find editions/ -name "*.json" | wc -l

      - name: Create a list of all word-by-word files
        run: |
          cd Quran_API_Complete
          echo "فهرست کامل فایل‌های word-by-word:" > word_by_word_filelist.txt
          find editions/ -name "*.json" | grep -v "/ar-" >> word_by_word_filelist.txt
          echo "" >> word_by_word_filelist.txt
          echo "✅ دانلود کامل شد. این ریپازیتوری شامل ترجمه word-by-word به بیش از 90 زبان است." >> word_by_word_filelist.txt

      - name: Compress everything
        run: zip -r "Quran_API_Complete.zip" "Quran_API_Complete"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "04-Quran-API-fawazahmed0-Complete"
          path: "Quran_API_Complete.zip"
