name: Get Quran Data from Mendeley

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Quran dataset from Mendeley
        run: |
          mkdir quran_data
          cd quran_data
          curl -L -o quran_dataset.zip "https://data.mendeley.com/public-files/datasets/rk96pn66m4/files/XXX"
          unzip quran_dataset.zip
          ls -la
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-complete-data
          path: quran_data/
