name: 03-Fetch-Word-by-Word-Translations
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y zip curl jq
      
      - name: Download Word-by-Word Data (English, Persian, Urdu, etc.)
        run: |
          mkdir -p "WordByWord_Data"
          cd "WordByWord_Data"
          
          # منبع فوق العاده: بیش از 90 زبان و 440 ترجمه در قالب Word-by-Word
          # مستندات: https://github.com/fawazahmed0/quran-api
          
          # --- فهرست زبان‌های Word-by-Word ---
          # en_rwwad (English - Ruwwad)
          # fa_makarem (فارسی - مکارم شیرازی)
          # ur_ahmedali (Urdu - Ahmed Ali)
          # id_mubarok (Indonesia - Mubarok)
          # tr_yazir (Turkish - Yazir)
          # ru_kuliev (Russian - Kuliev)
          
          for edition in en_rwwad fa_makarem ur_ahmedali id_mubarok tr_yazir; do
            echo "دریافت Word-by-Word برای: $edition"
            curl -L -o "word_by_word_${edition}.json" \
              "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/${edition}.json"
          done
          
          # همچنین متن اصلی عربی را با جزئیات کلمات (برای تطابق) دریافت کن
          echo "دریافت متن اصلی عربی word-by-word..."
          curl -L -o "arabic_words.json" \
            "https://raw.githubusercontent.com/fawazahmed0/quran-api/refs/heads/main/editions/ar-lt.json"
          
          echo "✅ تمام فایل‌های Word-by-Word دریافت شدند."
          ls -la
          
      - name: Create a clean CSV sample
        run: |
          cd "WordByWord_Data"
          # نمونه ساده: استخراج سوره اول، آیه اول به صورت CSV (اختیاری)
          echo "Surah,Ayah,Word,Meaning" > sample_word_by_word.csv
          cat word_by_word_en_rwwad.json | jq -r '
            .[] | 
            .[] | 
            .[] | 
            {surah: .surah, ayah: .ayah, word: .word, meaning: .meaning} |
            [.surah, .ayah, .word, .meaning] | @csv
          ' >> sample_word_by_word.csv 2>/dev/null || echo "CSV sample could not be generated"
          
      - name: Compress Data
        run: zip -r "WordByWord_Complete.zip" "WordByWord_Data"
        
      - uses: actions/upload-artifact@v4
        with:
          name: "03-WordByWord-Translations"
          path: "WordByWord_Complete.zip"
