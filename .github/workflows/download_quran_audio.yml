name: Get Quran Phonetic Data

on:
  workflow_dispatch:  # فقط با دستور manual

jobs:
  download_phonetic:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y zip curl unzip
      
      - name: Download Quran Phonetic from Quranic Corpus
        run: |
          mkdir phonetic_data
          cd phonetic_data
          
          # روش 1: از everyayah.com (همان منبع خودت)
          # phonetic data در اینجا هست:
          curl -L -o "quran_phonetic.zip" "https://raw.githubusercontent.com/quranicdata/quranic-corpus/master/data/phonetic.csv"
          
          # اگر لینک بالا کار نکرد، از بک‌آپ استفاده کن:
          # curl -L -o "quran_phonetic.zip" "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/quran_data/phonetic.csv"
          
          cd ..
      
      - name: Extract and Process
        run: |
          if [ -f "phonetic_data/quran_phonetic.zip" ]; then
            unzip phonetic_data/quran_phonetic.zip -d phonetic_data/
            echo "✅ فایل phonetic دانلود شد"
            ls -la phonetic_data/
          else
            echo "⚠️ لینک مستقیم کار نکرد، از روش جایگزین استفاده می‌کنیم"
            # روش جایگزین: دانلود از Quran JSON API
            curl -L -o "phonetic_data/quran_phonetic.json" "https://api.alquran.cloud/v1/quran/ar.phonetic"
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-phonetic-data
          path: phonetic_data/
