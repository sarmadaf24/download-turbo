name: Get Quran Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Quran Data Repository
        run: |
          git clone --depth 1 https://github.com/fawazahmed0/quran-api.git
          git clone --depth 1 https://github.com/semarketir/quranjson.git

      - name: Copy data files
        run: |
          mkdir output
          find . -name "*.json" -exec cp {} output/ \; 2>/dev/null || true
          find . -name "*.txt" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quran-data
          path: output/
