name: 02-Abdul_Basit_Mujawwad_128kbps
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y zip curl
      - run: |
          mkdir -p "Abdul_Basit_Mujawwad_128kbps" && cd "Abdul_Basit_Mujawwad_128kbps"
          for s in {001..114}; do
            curl -L -o "Surah_${s}.zip" "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/zips/${s}.zip"
            echo "✅ سوره $s"
          done
      - run: zip -r "../Abdul_Basit_Mujawwad_128kbps.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: "Abdul_Basit_Mujawwad_128kbps"
          path: "Abdul_Basit_Mujawwad_128kbps.zip"
