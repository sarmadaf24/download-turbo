name: Download Quran Phonetic Data

on:
  workflow_dispatch:  # فقط با دستور manual اجرا شود

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download from Mendeley
        run: |
          # دانلود فایل کوچک (فقط phonetic data)
          wget https://data.mendeley.com/public-files/datasets/rk96pn66m4/files/xxx -O phonetic.zip
          # سایز واقعی: حدود 3-5 مگابایت (نه 40 گیگ!)
          # 40 گیگ مربوط به فایل‌های صوتی است، ما فقط به phonetic نیاز داریم
      
      - name: Extract phonetic data
        run: |
          unzip phonetic.zip
          # فیلتر کردن فقط فایل‌های CSV مربوط به phonetic
          find . -name "*phonetic*.csv" -exec cat {} \; > quran_phonetic.csv
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-phonetic
          path: quran_phonetic.csv
