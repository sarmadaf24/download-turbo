name: Abdul_Basit_Mujawwad_128kbps_Part1_Surahs_001-010
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y zip curl
      - run: |
          mkdir -p "Abdul_Basit_Mujawwad_Part1" && cd "Abdul_Basit_Mujawwad_Part1"
          for s in {001..010}; do
            curl -L -o "Surah_${s}.zip" "https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/zips/${s}.zip"
            echo "✅ سوره $s"
          done
          cd ..
      - run: zip -r "Abdul_Basit_Mujawwad_128kbps_Part1.zip" "Abdul_Basit_Mujawwad_Part1"
      - uses: actions/upload-artifact@v4
        with:
          name: "Abdul_Basit_Mujawwad_128kbps_Part1"
          path: "Abdul_Basit_Mujawwad_128kbps_Part1.zip"
