name: Get Quran Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir quran_data
          cd quran_data
          
          curl -L -o buckwalter.txt "https://raw.githubusercontent.com/quranicdata/quranic-corpus/master/data/buckwalter.txt"
          curl -L -o wordbyword.txt "https://raw.githubusercontent.com/mustafa0x/quran-morphology/master/data/quran-morphology-0.4.txt"
          curl -L -o mfa_phones.txt "https://raw.githubusercontent.com/MontrealCorpusTools/mfa-models/main/phonetic/arabic_mfa/arabic_mfa.txt"
          
          ls -la
          
      - uses: actions/upload-artifact@v4
        with:
          name: quran-data
          path: quran_data/
