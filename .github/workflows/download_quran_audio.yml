name: 10-Ultra-Reliable-WordByWord
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y git zip

      - name: Clone full repository (shallow clone)
        run: |
          git clone --depth 1 https://github.com/fawazahmed0/quran-api.git Quran_API_Complete
          cd Quran_API_Complete
          echo "✅ Clone کامل انجام شد"

      - name: Compress with maximum compression
        run: |
          zip -r -9 "Quran_API_Complete.zip" "Quran_API_Complete"
          echo "✅ فشرده‌سازی انجام شد"
          ls -lh Quran_API_Complete.zip
          md5sum Quran_API_Complete.zip > original_checksum.txt

      - name: Split into 200MB parts (safer for unstable internet)
        run: |
          mkdir parts
          cd parts
          split -b 200m "../Quran_API_Complete.zip" "part_"
          echo "✅ تقسیم به پارت‌های 200MB انجام شد"
          ls -lh

      - name: Generate checksums for each part
        run: |
          cd parts
          for part in part_*; do
            md5sum "$part" > "${part}.md5"
            echo "چکسام برای $part: $(cat ${part}.md5)"
          done

      - name: Create automatic assembly script for Windows
        run: |
          cat > assemble.bat << 'EOF'
          @echo off
          echo ==========================================
          echo شروع چیدن پارت‌ها...
          echo ==========================================
          
          REM چک کردن وجود همه فایل‌ها
          set MISSING=0
          for %%f in (part_aa part_ab part_ac part_ad part_ae part_af part_ag part_ah part_ai part_aj part_ak part_al part_am part_an part_ao part_ap part_aq part_ar part_as part_at part_au part_av part_aw part_ax part_ay part_az part_ba part_bb part_bc part_bd part_be part_bf part_bg) do (
            if not exist "%%f" (
              echo ❌ فایل %%f پیدا نشد!
              set MISSING=1
            )
          )
          
          if %MISSING%==1 (
            echo ❌ برخی فایل‌ها وجود ندارند. لطفاً همه پارت‌ها را دانلود کنید.
            pause
            exit /b 1
          )
          
          echo ✅ همه فایل‌ها وجود دارند.
          echo.
          echo در حال چیدن فایل‌ها...
          copy /b part_* Quran_API_Complete.zip
          
          if %errorlevel% neq 0 (
            echo ❌ خطا در چیدن فایل‌ها!
            pause
            exit /b 1
          )
          
          echo.
          echo ==========================================
          echo ✅ فایل Quran_API_Complete.zip ساخته شد.
          echo حجم فایل:
          dir Quran_API_Complete.zip
          echo ==========================================
          echo.
          echo حالا فایل را با 7-Zip اکسترکت کنید.
          echo راست کلیک -> 7-Zip -> Extract Here
          echo.
          pause
          EOF

      - name: Create checksum verification script
        run: |
          cat > verify.bat << 'EOF'
          @echo off
          echo ==========================================
          echo در حال بررسی صحت پارت‌ها...
          echo ==========================================
          
          for %%f in (part_aa part_ab part_ac part_ad part_ae part_af part_ag part_ah part_ai part_aj part_ak part_al part_am part_an part_ao part_ap part_aq part_ar part_as part_at part_au part_av part_aw part_ax part_ay part_az part_ba part_bb part_bc part_bd part_be part_bf part_bg) do (
            if exist "%%f.md5" (
              echo چک کردن %%f...
              certutil -hashfile "%%f" MD5 | findstr /i "%%f.md5" > nul 2>&1
              if errorlevel 1 (
                echo ❌ %%f خراب است!
              ) else (
                echo ✅ %%f سالم است.
              )
            )
          )
          
          echo.
          echo ==========================================
          echo بررسی کامل شد.
          pause
          EOF

      - name: Upload each part as separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: "part_aa"
          path: "parts/part_aa"

      - name: Upload part_ab
        uses: actions/upload-artifact@v4
        with:
          name: "part_ab"
          path: "parts/part_ab"

