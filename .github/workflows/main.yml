name: Download Quran Transliterations

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories for transliterations
        run: |
          mkdir -p quran-transliterations
          cd quran-transliterations
          mkdir -p english russian kazakh turkish armenian bengali chinese spanish french indonesian swedish urdu

      # ========== ENGLISH ==========
      - name: Download English Transliteration (maqsats)
        run: |
          curl -L -o quran-transliterations/english/translit_en.txt "https://raw.githubusercontent.com/maqsats/Quran-Transliteration-/main/translit_en.txt"
          
      - name: Download English Transliteration (risan)
        run: |
          curl -L -o quran-transliterations/english/quran_transliteration.json "https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran_transliteration.json"

      # ========== RUSSIAN ==========
      - name: Download Russian Transliteration (maqsats)
        run: |
          curl -L -o quran-transliterations/russian/translit_ru.txt "https://raw.githubusercontent.com/maqsats/Quran-Transliteration-/main/translit_ru.txt"
          
      - name: Download Russian Transliteration (quran-cloud)
        run: |
          curl -L -o quran-transliterations/russian/quran_ru.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_ru.json"

      # ========== KAZAKH ==========
      - name: Download Kazakh Transliteration
        run: |
          curl -L -o quran-transliterations/kazakh/translit_kk.xml "https://raw.githubusercontent.com/maqsats/Quran-Transliteration-/main/translit_kk.xml"

      # ========== TURKISH ==========
      - name: Download Turkish Transliteration
        run: |
          curl -L -o quran-transliterations/turkish/quran_tr.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_tr.json"

      # ========== ARMENIAN ==========
      - name: Download Armenian Transliteration
        run: |
          curl -L -o quran-transliterations/armenian/quran_hy.json "https://raw.githubusercontent.com/smashah/quran.sh/main/armenian.json" || echo "Armenian file not found, skipping..."

      # ========== BENGALI ==========
      - name: Download Bengali Transliteration
        run: |
          curl -L -o quran-transliterations/bengali/quran_bn.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_bn.json"

      # ========== CHINESE ==========
      - name: Download Chinese Transliteration
        run: |
          curl -L -o quran-transliterations/chinese/quran_zh.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_zh.json"

      # ========== SPANISH ==========
      - name: Download Spanish Transliteration
        run: |
          curl -L -o quran-transliterations/spanish/quran_es.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_es.json"

      # ========== FRENCH ==========
      - name: Download French Transliteration
        run: |
          curl -L -o quran-transliterations/french/quran_fr.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_fr.json"

      # ========== INDONESIAN ==========
      - name: Download Indonesian Transliteration
        run: |
          curl -L -o quran-transliterations/indonesian/quran_id.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_id.json"

      # ========== SWEDISH ==========
      - name: Download Swedish Transliteration
        run: |
          curl -L -o quran-transliterations/swedish/quran_sv.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_sv.json"

      # ========== URDU ==========
      - name: Download Urdu Transliteration
        run: |
          curl -L -o quran-transliterations/urdu/quran_ur.json "https://cdn.jsdelivr.net/npm/quran-cloud@1.0.0/dist/quran_ur.json"

      # ========== CREATE SUMMARY FILE ==========
      - name: Create summary of downloaded files
        run: |
          echo "# Quran Transliterations Downloaded" > quran-transliterations/README.md
          echo "" >> quran-transliterations/README.md
          echo "## Files downloaded:" >> quran-transliterations/README.md
          echo "" >> quran-transliterations/README.md
          echo "| Language | File | Size |" >> quran-transliterations/README.md
          echo "|----------|------|------|" >> quran-transliterations/README.md
          
          for lang in english russian kazakh turkish armenian bengali chinese spanish french indonesian swedish urdu; do
            if [ -d "quran-transliterations/$lang" ]; then
              for file in quran-transliterations/$lang/*; do
                if [ -f "$file" ]; then
                  size=$(du -h "$file" | cut -f1)
                  filename=$(basename "$file")
                  echo "| $lang | \`$filename\` | $size |" >> quran-transliterations/README.md
                fi
              done
            fi
          done
          
          echo "" >> quran-transliterations/README.md
          echo "## Total files: $(find quran-transliterations -type f -name '*.txt' -o -name '*.json' -o -name '*.xml' | wc -l)" >> quran-transliterations/README.md

      # ========== UPLOAD AS ARTIFACT ==========
      - name: Upload all transliterations as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-transliterations-all
          path: ./quran-transliterations/
          retention-days: 90
