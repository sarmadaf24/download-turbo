name: Download Whisper Large-V3 Model

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Large-V3 model (2.9GB)
        run: |
          echo "Downloading Whisper Large-V3 model..."
          curl -L -o model.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin"
          ls -lh model.bin

      - name: Create models directory
        run: mkdir -p models

      - name: Move model
        run: mv model.bin ./models/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-model
          path: ./models/model.bin
          retention-days: 30
